<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<link rel="icon" href="data:,"/>
<title>The Lineup — GTA RP Event Magazine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ===== NEON FLIP-THROUGH — cover first, then one spread per day ===== */
:root{
  color-scheme:dark;
  --void:#0d0716; --void2:#150a28;
  --panel:#150c2a; --panel2:#1a0f33;
  --ink:#ece8f7; --ink2:#bcb3da; --ink3:#9187b5;
  --cyan:#22d3ee; --cyan-hi:#67e8f9; --cyan-soft:rgba(34,211,238,.35);
  --pink:#f471b5; --pink-hi:#f9a8d4; --mag:#e879f9;
  --violet:#a78bfa; --violet-hi:#c4b5fd;
  --amber:#fbbf24; --amber-hi:#fcd34d;
  --rose:#fb7185; --rose-hi:#fda4af;
  --line:rgba(150,128,214,.26); --line2:rgba(150,128,214,.15);
  --sans:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --disp:'Rajdhani',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'Share Tech Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.55;
  background:
    radial-gradient(900px 520px at 85% -60px, rgba(232,121,249,.13), rgba(232,121,249,0) 60%),
    radial-gradient(820px 560px at -10% 30%, rgba(34,211,238,.10), rgba(34,211,238,0) 62%),
    radial-gradient(1000px 700px at 110% 78%, rgba(124,58,237,.12), rgba(124,58,237,0) 65%),
    linear-gradient(180deg, var(--void2), var(--void) 340px);
  background-color:var(--void); background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(232,121,249,.38); color:#fff}
a{color:var(--cyan-hi); text-decoration:none}
a:hover{text-decoration:underline}
img{display:block; max-width:100%}
.wrap{max-width:1180px; margin:0 auto; padding:0 18px}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px; border-radius:2px}

/* TICKER — neon wire across the top */
.ticker{background:rgba(10,5,22,.92); overflow:hidden; padding:9px 0; border-bottom:1px solid var(--cyan-soft); box-shadow:0 1px 14px rgba(34,211,238,.18)}
.ticker-track{display:flex; width:max-content; animation:tick 46s linear infinite}
.ticker span{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; padding-right:14px; color:var(--ink2)}
.ticker b{color:var(--amber-hi); font-weight:400; text-shadow:0 0 8px rgba(251,191,36,.5)}
.ticker i{color:var(--pink); font-style:normal; text-shadow:0 0 8px rgba(244,113,182,.6)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* FLIP BAR — sticky reader chrome: flip controls, day jump strip, filters */
.flipbar{position:sticky; top:0; z-index:40; background:rgba(10,5,22,.94); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border-bottom:1px solid rgba(34,211,238,.35); box-shadow:0 2px 18px rgba(34,211,238,.12)}
.fb-main{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0 8px}
.fb-btn{appearance:none; border:1px solid var(--cyan); background:rgba(34,211,238,.1); color:var(--cyan-hi); font-family:var(--mono); font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; padding:9px 16px; border-radius:999px; cursor:pointer; box-shadow:0 0 10px rgba(34,211,238,.22); white-space:nowrap}
.fb-btn:hover:not(:disabled){background:rgba(34,211,238,.24); color:#ecfeff}
.fb-btn:disabled{opacity:.32; cursor:default; box-shadow:none}
.fb-label{text-align:center; min-width:0}
.fb-label b{display:block; font-family:var(--disp); font-weight:700; font-size:19px; letter-spacing:.05em; text-transform:uppercase; color:#f7f4ff; line-height:1.05; text-shadow:0 0 10px rgba(232,121,249,.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fb-label span{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3)}
.fb-tools{display:flex; justify-content:center; gap:8px; margin-top:5px}
.fb-tools button{appearance:none; border:1px solid var(--line); background:rgba(21,12,42,.7); color:var(--ink2); font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:4px 10px; border-radius:999px; cursor:pointer}
.fb-tools button:hover{border-color:var(--cyan-soft); color:var(--cyan-hi)}
.fb-tools button[aria-expanded="true"]{border-color:var(--pink); color:var(--pink-hi); background:rgba(244,113,182,.1)}
.fb-days{display:none; flex-wrap:wrap; gap:6px; padding:8px 0 4px}
.flipbar.open-days .fb-days{display:flex}
.fb-days button{appearance:none; border:1px solid var(--line2); background:rgba(21,12,42,.7); color:var(--ink2); font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:5px 9px; border-radius:4px; cursor:pointer}
.fb-days button:hover{border-color:var(--cyan-soft); color:var(--cyan-hi)}
.fb-days button.on{border-color:var(--pink); color:var(--pink-hi); background:rgba(244,113,182,.1); box-shadow:0 0 8px rgba(244,113,182,.35)}
.fb-days button:disabled{opacity:.3; cursor:default; box-shadow:none}
.fb-filters{display:none; flex-wrap:wrap; gap:7px; padding:4px 0 11px}
.flipbar.open-filters .fb-filters{display:flex}
.fb-filters button{appearance:none; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--ink2); padding:6px 12px; font-family:var(--sans); font-weight:600; letter-spacing:.05em; text-transform:uppercase; font-size:11px; cursor:pointer}
.fb-filters button:hover{border-color:var(--cyan-soft); color:var(--cyan-hi)}
.fb-filters button.active{background:rgba(34,211,238,.16); color:#a5f3fc; border-color:var(--cyan); box-shadow:0 0 10px rgba(34,211,238,.35)}

/* PAGES — one screen at a time, flipped */
.page{display:none}
.page.active{display:block; animation:flipIn .38s ease both}
@keyframes flipIn{from{opacity:0; transform:translateX(26px)}to{opacity:1; transform:none}}
.page.back.active{animation:flipBack .38s ease both}
@keyframes flipBack{from{opacity:0; transform:translateX(-26px)}to{opacity:1; transform:none}}

/* COVER SCREEN — page 1: a swappable PHOTO (assets key "cover") with the
   Newsstand cover's words as a live HTML overlay (.cover-overlay, inner
   HTML computed per build by the generator and substituted into the
   cover section). Words and photo live separate lives: the overlay
   refreshes with the event data, the photo only changes when the asset
   does. Type per the media guide / approved mock: Anton (heavy
   condensed) for masthead + cover lines, mono for dates, Pitch Black /
   Cyber Magenta / Toxic Green / Neon Cyan; sizes in cqw so the layout
   scales with the frame exactly like the 1080x1350 mock. CSS gradient
   scrims + text shadows keep every word off the photo's mercy. */
.cover-screen{position:relative; margin:22px auto 0; border:1px solid var(--cyan-soft); border-top:2px solid rgba(244,113,182,.65); border-radius:14px; background:#000; overflow:hidden; box-shadow:0 0 22px rgba(34,211,238,.14), 0 0 46px rgba(232,121,249,.08)}
.cover-screen.photo{width:min(100%,70vh); aspect-ratio:4/5; container-type:inline-size}
.cover-screen.photo>img{display:block; width:100%; height:100%; object-fit:cover}
.cover-overlay{position:absolute; inset:0; z-index:2; pointer-events:none; --cmag:#ff2d78; --ctox:#39ff14; --ccyn:#2de1ff; --cpit:#06060c; --cov-foot-band:23.5cqw; font-family:var(--sans)}
.cov-scrims{position:absolute; inset:0; background:linear-gradient(180deg, rgba(3,3,8,.93) 0%, rgba(3,3,8,.5) 14%, rgba(3,3,8,0) 33%), linear-gradient(0deg, rgba(3,3,8,.94) 0%, rgba(3,3,8,.4) 13%, rgba(3,3,8,0) 31%), linear-gradient(90deg, rgba(3,3,8,.48) 0%, rgba(3,3,8,0) 54%), linear-gradient(270deg, rgba(3,3,8,.44) 0%, rgba(3,3,8,0) 54%)}
.cov-strip{position:absolute; top:2.1%; left:4.3%; right:4.3%; text-align:right; font-family:var(--mono); font-size:2.25cqw; letter-spacing:.1em; color:#f5f5fa; border-bottom:2px solid rgba(245,245,250,.92); padding-bottom:1.5cqw; text-shadow:0 2px 6px rgba(0,0,0,.9)}
.cov-tags{position:absolute; top:6.6%; left:4.3%; right:4.3%; display:flex; align-items:center; gap:1.3cqw}
.cov-chip{background:var(--ctox); color:var(--cpit); font-family:var(--mono); font-weight:700; font-size:1.95cqw; letter-spacing:.05em; line-height:1; padding:.8cqw 1.1cqw; white-space:nowrap; box-shadow:0 2px 10px rgba(0,0,0,.55)}
.cov-loc{margin-left:auto; font-family:var(--mono); font-size:1.95cqw; letter-spacing:.16em; color:#c8cddc; text-shadow:0 2px 6px rgba(0,0,0,.9); white-space:nowrap}
.cov-mast{position:absolute; top:10.1%; left:0; right:0; text-align:center; font-family:'Anton', 'Arial Narrow', sans-serif; font-size:17.8cqw; line-height:1; letter-spacing:.005em; color:#fff; text-shadow:-.5cqw 0 1.4cqw rgba(255,45,120,.5), .5cqw 0 1.4cqw rgba(45,225,255,.5), 0 .35cqw 0 rgba(6,6,12,.9), 0 0 3cqw rgba(0,0,0,.6)}
.cov-rule{position:absolute; top:25.9%; left:4.3%; right:4.3%; height:.38cqw; background:var(--cmag); box-shadow:0 0 1.2cqw rgba(255,45,120,.65)}
.cov-line{position:absolute; width:46.5%; z-index:2}
.cov-a{left:4.3%; top:34.6%}
/* .cov-b is bottom-anchored above --cov-foot-band, the bottom band reserved
   for .cov-foot's barcode furniture: the block grows upward, so even a
   wrapped subline can never reach the barcode zone. */
.cov-b{left:4.3%; bottom:var(--cov-foot-band)}
.cov-c{right:4.3%; top:45.3%; text-align:right}
.cov-d{right:4.3%; top:77.8%; text-align:right}
.cov-kick{font-family:'Anton', 'Arial Narrow', sans-serif; font-size:2.75cqw; letter-spacing:.13em; margin:0 0 1.1cqw; text-shadow:0 2px 8px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9)}
.cov-head{font-family:'Anton', 'Arial Narrow', sans-serif; font-size:6.9cqw; line-height:1.06; margin:0; color:#fff; text-transform:uppercase; text-shadow:.3cqw .3cqw 0 rgba(6,6,12,.82), 0 0 2.6cqw rgba(0,0,0,.7)}
.cov-sub{font-size:2.6cqw; line-height:1.28; margin:1cqw 0 0; color:#f5f5fa; text-shadow:0 2px 7px rgba(0,0,0,.92), 0 0 2px rgba(0,0,0,.9)}
.cov-sub.cov-mono{font-family:var(--mono); font-size:2.35cqw; letter-spacing:.03em}
.cov-mag{color:var(--cmag)}
.cov-toxic{color:var(--ctox)}
.cov-cyan{color:var(--ccyn)}
.cov-wht{color:#fff}
.cov-foot{position:absolute; left:4.3%; bottom:3.3%; z-index:2}
.cov-barcode{width:16.3cqw; aspect-ratio:2.05; background:#fafafa; padding:1cqw 1.2cqw; box-shadow:0 2px 10px rgba(0,0,0,.55)}
.cov-barcode i{display:block; height:100%; background:repeating-linear-gradient(90deg, #0a0a0a 0 .25cqw, transparent .25cqw .45cqw, #0a0a0a .45cqw .8cqw, transparent .8cqw 1cqw, #0a0a0a 1cqw 1.15cqw, transparent 1.15cqw 1.5cqw, #0a0a0a 1.5cqw 1.95cqw, transparent 1.95cqw 2.2cqw)}
.cov-free{font-family:'Anton', 'Arial Narrow', sans-serif; font-size:2.4cqw; letter-spacing:.1em; color:#fff; margin:1.1cqw 0 0; text-shadow:0 2px 7px rgba(0,0,0,.92)}
.cov-handle{font-size:2.05cqw; color:#c8cddc; margin:.45cqw 0 0; text-shadow:0 2px 7px rgba(0,0,0,.92)}
.flip-hint{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); text-align:center; padding:0 0 26px}

/* DAY SPREAD HEAD — huge day numeral */
.day-head{display:flex; align-items:flex-end; gap:18px; margin:30px 0 6px; flex-wrap:wrap}
.day-num{font-family:var(--disp); font-weight:700; font-size:clamp(96px,17vw,168px); line-height:.78; color:#f7f4ff; text-shadow:0 0 18px rgba(34,211,238,.45), 0 0 52px rgba(232,121,249,.28)}
.day-head .day-meta{padding-bottom:10px}
.day-dow{font-family:var(--mono); font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--pink-hi); text-shadow:0 0 9px rgba(244,113,182,.5); margin:0 0 4px}
.day-full{font-family:var(--disp); font-weight:700; font-size:clamp(30px,4.6vw,44px); line-height:1; margin:0; letter-spacing:.03em; text-transform:uppercase; color:#f7f4ff}
.day-note{margin:6px 0 0; font-size:14.5px; color:var(--ink2); max-width:56ch}
.day-badge{display:inline-block; margin-left:10px; vertical-align:middle; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:#150a28; background:var(--amber); border-radius:4px; padding:4px 9px; box-shadow:0 0 12px rgba(251,191,36,.5)}
.day-count{margin-left:auto; padding-bottom:12px; font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--cyan-hi); text-shadow:0 0 8px rgba(34,211,238,.4); white-space:nowrap}
.day-rule{height:1px; background:linear-gradient(90deg, var(--cyan), rgba(244,113,182,.7), transparent); box-shadow:0 0 10px rgba(34,211,238,.35); margin:10px 0 22px}

/* FEATURE — photo-led spread block inside a day */
.feature{border:1px solid var(--cyan-soft); border-top:2px solid rgba(244,113,182,.55); border-radius:12px; background:linear-gradient(180deg, rgba(26,15,51,.93), rgba(15,8,30,.95)); margin-bottom:22px; overflow:hidden; box-shadow:0 0 20px rgba(34,211,238,.07), inset 0 0 34px rgba(13,7,22,.45)}
.feature.split{display:grid; grid-template-columns:1fr 1fr}
.feature.split .feature-body{display:flex; flex-direction:column; justify-content:center}
.feature-body{padding:22px 24px 24px}
.feature-body h3{font-family:var(--disp); font-weight:700; font-size:clamp(32px,4.4vw,50px); line-height:.95; margin:0 0 10px; letter-spacing:.03em; text-transform:uppercase; color:#f7f4ff; text-shadow:0 0 12px rgba(34,211,238,.35)}
.feature-body h3 span{color:var(--pink-hi); text-shadow:0 0 12px rgba(244,113,182,.55)}
.feature-body p{font-size:14.5px; line-height:1.65; color:var(--ink2); max-width:72ch}
.pull{font-size:18px; font-weight:600; line-height:1.45; background:rgba(232,121,249,.07); border:1px solid rgba(232,121,249,.35); border-radius:10px; padding:14px 16px; margin:16px 0; color:var(--ink); box-shadow:0 0 14px rgba(232,121,249,.1), inset 0 0 20px rgba(13,7,22,.4)}
.pull::before{content:"“ "; color:var(--mag); text-shadow:0 0 8px rgba(232,121,249,.6)}
.facts{margin-top:16px; display:flex; flex-wrap:wrap; gap:8px}
.facts div{background:rgba(10,5,22,.7); border:1px solid var(--line2); border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600; color:var(--ink)}
.facts div b{display:block; font-family:var(--mono); letter-spacing:.12em; text-transform:uppercase; font-size:9.5px; color:var(--cyan-hi); font-weight:400; margin-bottom:1px}
.flyer-fig{margin:0; background:#05030d; display:flex; flex-direction:column}
.flyer-fig img{width:100%; height:100%; flex:1; object-fit:cover}
.flyer-fig figcaption{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); padding:10px 14px; border-top:1px solid var(--line2); line-height:1.7}

/* DAY GRID — the rest of the day's listings */
.day-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding-bottom:8px}
.event{border:1px solid rgba(34,211,238,.26); border-radius:12px; background:linear-gradient(180deg, rgba(27,16,54,.94), rgba(16,9,33,.96)); padding:20px 16px 16px; display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden; box-shadow:0 0 12px rgba(34,211,238,.05), inset 0 0 22px rgba(13,7,22,.4)}
.event::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--cyan); box-shadow:0 0 10px rgba(34,211,238,.7)}
.event.s-halloween::before{background:var(--pink); box-shadow:0 0 10px rgba(244,113,182,.7)}
.event.s-launch::before{background:var(--amber); box-shadow:0 0 10px rgba(251,191,36,.7)}
.event.s-contest::before{background:var(--rose); box-shadow:0 0 10px rgba(251,113,133,.7)}
.event .date{font-family:var(--mono); font-size:12.5px; letter-spacing:.06em; color:var(--pink-hi); text-shadow:0 0 8px rgba(244,113,182,.4)}
.event h3{margin:0; font-family:var(--disp); font-size:21px; line-height:1.15; font-weight:700; letter-spacing:.02em; color:#f7f4ff}
.event p{margin:0; font-size:13.5px; line-height:1.55; color:var(--ink2)}
.event.solo{grid-column:1/-1; max-width:680px; padding:28px 24px 22px}
.event.solo h3{font-size:clamp(28px,4.4vw,38px)}
.event.solo p{font-size:15px}
.meta{margin-top:auto; padding-top:10px; display:flex; flex-wrap:wrap; gap:6px}
.meta span,.meta a{font-size:11px; font-family:var(--mono); letter-spacing:.04em; text-transform:uppercase; border:1px solid var(--line2); border-radius:999px; padding:4px 9px; color:var(--ink2); background:rgba(21,12,42,.85)}
.meta a{text-decoration:none; color:var(--pink-hi); border-color:rgba(244,113,182,.55); background:rgba(244,113,182,.07)}
.meta a:hover{border-color:var(--pink); color:#fbcfe8; box-shadow:0 0 10px rgba(244,113,182,.45); text-shadow:0 0 8px rgba(244,113,182,.6); text-decoration:none}
.meta a.flyer-link{color:var(--cyan-hi); border-color:rgba(34,211,238,.55); background:rgba(34,211,238,.07)}
.meta a.flyer-link:hover{border-color:var(--cyan); color:#ecfeff; box-shadow:0 0 10px rgba(34,211,238,.45); text-shadow:0 0 8px rgba(34,211,238,.6)}
a.ig{color:var(--pink-hi); font-weight:400; font-family:var(--mono); font-size:.94em; text-decoration:none; text-shadow:0 0 7px rgba(244,113,182,.35)}
a.ig:hover{color:#fbcfe8; text-decoration:underline; text-underline-offset:3px}
.day-empty{border:1px dashed rgba(167,139,250,.45); border-radius:12px; padding:22px; text-align:center; color:var(--ink2); font-size:14px; font-style:italic; margin-bottom:10px}

/* HOST SPOTLIGHT — one organizer, a full spread of their own */
.spot-head{margin:30px 0 18px}
.spot-kicker{font-family:var(--mono); font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--amber-hi); text-shadow:0 0 9px rgba(251,191,36,.5); margin:0 0 6px}
.spot-title{font-family:var(--disp); font-weight:700; font-size:clamp(38px,6vw,64px); line-height:.95; margin:0; letter-spacing:.02em; text-transform:uppercase; color:#f7f4ff; text-shadow:0 0 14px rgba(34,211,238,.4)}
.spot-title span{color:var(--pink-hi); text-shadow:0 0 14px rgba(244,113,182,.55)}
.spot-lede{margin:10px 0 0; font-size:15.5px; line-height:1.6; color:var(--ink2); max-width:62ch}
.spot-panel{display:grid; grid-template-columns:1fr 1fr; border:1px solid rgba(251,191,36,.5); border-top:2px solid rgba(244,113,182,.6); border-radius:12px; overflow:hidden; background:linear-gradient(180deg, rgba(26,15,51,.93), rgba(15,8,30,.95)); box-shadow:0 0 22px rgba(251,191,36,.1), inset 0 0 34px rgba(13,7,22,.45); margin-bottom:26px}
.spot-body{padding:24px 26px 26px; display:flex; flex-direction:column; justify-content:center}
.spot-name{font-family:var(--disp); font-weight:700; font-size:clamp(34px,5vw,52px); line-height:.95; margin:0; letter-spacing:.02em; text-transform:uppercase; color:#f7f4ff; text-shadow:0 0 12px rgba(34,211,238,.35)}
.spot-handle{display:inline-block; margin-top:8px; font-family:var(--mono); font-size:16px; letter-spacing:.04em; color:var(--pink-hi); text-shadow:0 0 9px rgba(244,113,182,.45)}
.spot-handle:hover{color:#fbcfe8}
.spot-bio{font-size:14.5px; line-height:1.65; color:var(--ink2); margin:14px 0 0}
.spot-bio b{color:var(--ink)}
.spot-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
.follow-btn{display:inline-block; border:1px solid var(--pink); background:rgba(244,113,182,.16); color:var(--pink-hi); font-family:var(--mono); font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; padding:11px 18px; border-radius:999px; box-shadow:0 0 12px rgba(244,113,182,.35)}
.follow-btn:hover{background:rgba(244,113,182,.3); color:#fdf2f8; text-decoration:none}
.spot-jump{appearance:none; border:1px solid var(--cyan); background:rgba(34,211,238,.08); color:var(--cyan-hi); font-family:var(--mono); font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; padding:11px 18px; border-radius:999px; cursor:pointer; box-shadow:0 0 10px rgba(34,211,238,.22)}
.spot-jump:hover{background:rgba(34,211,238,.22); color:#ecfeff}
@media(max-width:860px){
  .spot-panel{grid-template-columns:1fr}
}

function igLink(handle,label){

  return '<article class="feature split"><figure class="flyer-fig"><img src="'+f.img+'" alt="'+f.alt+'"/><figcaption>'+cap+'</figcaption></figure><div class="feature-body"><h3>'+f.head+'</h3>'+f.body+'<div class="facts">'+facts+'</div></div></article>';
}

var CLOSING='<div class="closing"><h3>Get listed in the next issue</h3><p>Hosting a meet, launch or contest? The Lineup is built from the same watch as the GTA RP Event Calendar — dated flyers with a time, place and platform get picked up on the 12 AM / 12 PM runs. Weekly regulars riding along in this issue: <b>Clean Culture</b> (Fri &amp; Sat · '+igLink('@jankyxbl')+' · Xbox) and <b>SixSocietyRC</b> (Saturdays).</p><a class="btn" href="https://tinyurl.com/GTA-RP-EVENT-Calendar" target="_blank" rel="noopener">Open the Full Calendar →</a></div><div class="colophon"><b>The Lineup</b> — GTA RP Event Magazine · Issue 01 · Oct 23, 2026<br>From the @gtarpnoticeboard desk · Events as listed by their organizers · In-game RP events only</div>';

/* Build one spread per day */
var stage=document.getElementById('stage');
DAYS.forEach(function(d,di){
  var dayEvents=EVENTS.filter(function(e){return e.date===d.key});
  var sec=document.createElement('section');
  sec.className='page'; sec.setAttribute('data-title',d.full); sec.setAttribute('aria-label',d.full);
  var badge=d.badge?'<span class="day-badge">'+d.badge+'</span>':'';
  sec.innerHTML='<div class="day-head"><div class="day-num" aria-hidden="true">'+d.num+'</div><div class="day-meta"><p class="day-dow">'+d.dow+'</p><h2 class="day-full" tabindex="-1">'+d.full+badge+'</h2><p class="day-note">'+d.note+'</p></div><div class="day-count" data-count></div></div><div class="day-rule"></div><div data-body></div>'+(di===DAYS.length-1?CLOSING:'');
  sec._day=d; sec._events=dayEvents;
  stage.appendChild(sec);
});

/* HOST SPOTLIGHT spread — one organizer featured, sitting between the Saturday and Sunday spreads */
var SPOT_HTML=
 '<div class="spot-head"><p class="spot-kicker">Host Spotlight — One Organizer, Featured</p>'+
 '<h2 class="spot-title" tabindex="-1">The host of <span>Saturday night</span></h2>'+
 '<p class="spot-lede">Every issue, one organizer gets a spread of their own. First in the chair: the crew opening a brand-new city in the middle of Halloween week — and the only host whose official flyer runs in this issue.</p></div>'+
 '<article class="spot-panel">'+
 '<figure class="flyer-fig"><img src="assets/wsp-flyer.jpg" alt="WSP City Roleplay official flyer: inauguration rescheduled to Saturday 24/10, blue neon city artwork"/><figcaption>The official flyer, as posted by '+igLink('@wsp_city_roleplay')+' · <a class="ig" href="'+POSTS['WSP City Roleplay — Inauguration']+'" target="_blank" rel="noopener">Original flyer post ↗</a></figcaption></figure>'+
 '<div class="spot-body">'+
 '<h3 class="spot-name">WSP City Roleplay</h3>'+
 '<a class="spot-handle" href="https://www.instagram.com/wsp_city_roleplay/" target="_blank" rel="noopener" aria-label="Open @wsp_city_roleplay on Instagram">@wsp_city_roleplay ↗</a>'+
 '<p class="spot-bio">WSP City’s inauguration was set once, then moved — the flyer on this page is the official notice, pushing opening night to <b>Saturday, October 24 at 8:30 PM</b> while the last adjustments land. It closes a stacked Saturday: the Dart Gang’s Best Build sprint wraps an hour before, and WSP gets the rest of the night to itself.</p>'+
 '<p class="spot-bio">The flyer lists no time zone, so run your clock off the host’s page, not ours. A brand-new city on a Saturday night fills its first lobby fast — the spotlight advice is simple: be early.</p>'+
 '<div class="facts"><div><b>Their event</b>WSP City Roleplay — Inauguration</div><div><b>When</b>Sat Oct 24 · 8:30 PM</div><div><b>Format</b>Server inauguration</div><div><b>Time zone</b>Not listed by organizer</div></div>'+
 '<div class="spot-actions"><a class="follow-btn" href="https://www.instagram.com/wsp_city_roleplay/" target="_blank" rel="noopener">Follow the host ↗</a><button class="spot-jump" id="spotJump" type="button">See their night — Sat 24 ›</button></div>'+
 '</div></article>';
var spotSec=document.createElement('section');
spotSec.className='page';
spotSec.setAttribute('data-title','Host Spotlight — WSP City Roleplay');
spotSec.setAttribute('aria-label','Host spotlight: WSP City Roleplay');
spotSec.innerHTML=SPOT_HTML;
spotSec._shown=1;
stage.insertBefore(spotSec, stage.children[3]);
spotSec.querySelector('#spotJump').addEventListener('click',function(){goTo(2,false)});

var pages=Array.prototype.slice.call(document.querySelectorAll('.page'));
var dayChips=document.getElementById('dayChips');
var chipEls=[];
/* Collapsible chrome: the day strip and filters stay tucked away until asked for */
var flipbarEl=document.querySelector('.flipbar');
var daysToggle=document.getElementById('daysToggle'), filterToggle=document.getElementById('filterToggle');
function setPanel(cls,btn,open){
  flipbarEl.classList.toggle(cls,open);
  btn.setAttribute('aria-expanded',open?'true':'false');
}
daysToggle.addEventListener('click',function(){
  setPanel('open-days',daysToggle,!flipbarEl.classList.contains('open-days'));
  setPanel('open-filters',filterToggle,false);
});
filterToggle.addEventListener('click',function(){
  setPanel('open-filters',filterToggle,!flipbarEl.classList.contains('open-filters'));
  setPanel('open-days',daysToggle,false);
});

function makeChip(label,pageIdx){
  var b=document.createElement('button'); b.type='button'; b.textContent=label;
  b.addEventListener('click',function(){goTo(pageIdx, pageIdx<current); setPanel('open-days',daysToggle,false)});
  dayChips.appendChild(b); chipEls[pageIdx]=b; return b;
}
makeChip('Cover',0);
DAYS.forEach(function(d,i){
  makeChip(d.chip, i+1+(i>=2?1:0));
  if(i===1){makeChip('Spotlight',3)}
});

var current=0, filter='all';
var prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn');
var fbTitle=document.getElementById('fbTitle'), fbCount=document.getElementById('fbCount');

function renderSpread(sec){
  if(!sec._events) return;
  var shown=sec._events.filter(function(e){return matches(e,filter)});
  var body=sec.querySelector('[data-body]');
  var feats=shown.filter(function(e){return FEATURES[e.title]});
  var rest=shown.filter(function(e){return !FEATURES[e.title]});
  var html='';
  feats.forEach(function(e){html+=featureHTML(e,FEATURES[e.title])});
  if(rest.length){
    html+='<div class="day-grid">'+rest.map(function(e){return cardHTML(e, shown.length===1)}).join('')+'</div>';
  }
  if(!shown.length){
    html='<div class="day-empty">Nothing in this lane on this day — flip on, or switch the filter back to All Events.</div>';
  }
  body.innerHTML=html;
  sec.querySelector('[data-count]').textContent=shown.length+(shown.length===1?' event':' events')+(filter!=='all'?' · filtered':'');
  sec._shown=shown.length;
}
function renderAll(){pages.forEach(renderSpread)}

/* A spread stays in the flip order if it has anything showing; the cover always stays */
function inPlay(i){return i===0||pages[i]._shown>0}
function playList(){var r=[];for(var i=0;i<pages.length;i++){if(inPlay(i))r.push(i)}return r}

function goTo(idx,back){
  var list=playList();
  if(list.indexOf(idx)===-1){idx=list[0]}
  pages.forEach(function(p,i){p.classList.toggle('active',i===idx); p.classList.toggle('back',!!back&&i===idx)});
  current=idx;
  var pos=list.indexOf(idx);
  fbTitle.textContent=idx===0?'Cover':pages[idx].getAttribute('data-title');
  fbCount.textContent='Spread '+(pos+1)+' of '+list.length;
  prevBtn.disabled=pos<=0; nextBtn.disabled=pos>=list.length-1;
  chipEls.forEach(function(c,i){if(c){c.classList.toggle('on',i===idx); c.disabled=!inPlay(i)}});
  window.scrollTo(0,0);
  var h=pages[idx].querySelector('.day-full')||pages[idx].querySelector('.spot-title'); if(h){h.focus({preventScroll:true})}
}
function step(dir){
  var list=playList(); var pos=list.indexOf(current);
  var n=list[pos+dir]; if(n===undefined)return;
  goTo(n, dir<0);
}
prevBtn.addEventListener('click',function(){step(-1)});
nextBtn.addEventListener('click',function(){step(1)});
document.addEventListener('keydown',function(ev){
  if(ev.target.tagName==='INPUT'||ev.target.tagName==='TEXTAREA')return;
  if(ev.key==='ArrowRight'){step(1)}
  else if(ev.key==='ArrowLeft'){step(-1)}
});
var tx=null,ty=null;
stage.addEventListener('touchstart',function(ev){var t=ev.changedTouches[0]; tx=t.clientX; ty=t.clientY},{passive:true});
stage.addEventListener('touchend',function(ev){
  if(tx===null)return;
  var t=ev.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty; tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){step(dx<0?1:-1)}
},{passive:true});

document.querySelectorAll('.fb-filters button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.fb-filters button').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    filter=b.getAttribute('data-filter');
    filterToggle.textContent=filter==='all'?'Filter ▾':'Filter: '+b.textContent+' ▾';
    filterToggle.style.borderColor=filter==='all'?'':'var(--cyan)';
    filterToggle.style.color=filter==='all'?'':'var(--cyan-hi)';
    renderAll();
    goTo(inPlay(current)?current:0, false);
  });
});

renderAll();
goTo(0,false);
</script>
</body>
</html>
